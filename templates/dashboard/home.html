{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM Store</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 14% 16%, rgba(240, 163, 106, .18), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(22, 184, 111, .14), transparent 32%),
        linear-gradient(135deg, #0b100d 0%, #172219 48%, #0a1210 100%);
      color: #f8fafc;
      font-family: Inter, Arial, sans-serif;
      padding: 20px;
    }

    .home-shell {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 38px;
      align-items: center;
      padding: 34px;
      border: 1px solid rgba(240, 163, 106, .22);
      border-radius: 8px;
      background: rgba(9, 15, 12, .62);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .32);
    }

    .home-logo {
      width: 100%;
      max-width: 280px;
      border-radius: 22px;
      box-shadow: 0 26px 72px rgba(0, 0, 0, .34);
    }

    .home-panel h1 {
      margin: 0;
      font-size: 58px;
      line-height: 1;
      letter-spacing: 0;
    }

    .home-panel p {
      color: #a9bdd6;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      margin: 16px 0 28px;
      max-width: 640px;
    }

    .home-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .home-action {
      min-height: 148px;
      border: 1px solid #3d5142;
      border-radius: 8px;
      background: rgba(18, 31, 23, .96);
      color: #f8fafc;
      text-decoration: none;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .2);
      transition: transform .18s ease, border-color .18s ease;
    }

    .home-action:hover {
      transform: translateY(-3px);
      border-color: #f0a36a;
    }

    .home-action.primary {
      background: linear-gradient(135deg, #f0a36a, #ffc27e);
      border-color: #ffc27e;
      color: #16110c;
    }

    .home-action strong {
      font-size: 25px;
      line-height: 1.1;
    }

    .home-action span {
      color: #a9bdd6;
      font-weight: 800;
    }

    .home-action.primary span {
      color: #432b18;
    }

    @media (max-width: 720px) {
      .home-shell {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 22px;
      }

      .home-logo {
        margin: 0 auto;
        max-width: 190px;
      }

      .home-panel h1 {
        font-size: 38px;
      }

      .home-actions {
        grid-template-columns: 1fr;
      }

      .home-action {
        min-height: 112px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="home-shell">
    <img class="home-logo" src="{% static 'images/dm-store-logo.svg' %}" alt="DM Store Daisy Mapa">
    <section class="home-panel">
      <h1>DM Store</h1>
      <p>Premium ordering and inventory control for counter service, dining rooms, and busy restaurant operations.</p>
      <div class="home-actions">
        <a class="home-action primary" href="{% url 'customer_order' %}">
          <strong>Customer View</strong>
          <span>Order products</span>
        </a>
        <a class="home-action" href="{% url 'dashboard' %}">
          <strong>Admin View</strong>
          <span>Login required</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
