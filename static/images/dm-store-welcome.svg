<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset=".48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#071020"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="12%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#2563eb" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1600" fill="url(#wall)"/>
  <rect width="1080" height="1600" fill="url(#spot)"/>

  <g opacity=".45">
