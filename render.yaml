services:
  - type: web
    name: dm-smart-inventory
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn smart_inventory.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: dm-smart-inventory.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://dm-smart-inventory.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ORDER_NOTIFICATIONS
        value: "False"
